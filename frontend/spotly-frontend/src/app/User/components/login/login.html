<div class="containerlog">
  <div class="signup-page">

    <!-- Decorative Background -->
    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>

    <!-- Logo -->
          <a routerLink="/home" class="homee"><i class="fa-solid fa-house"></i></a>

    <div class="logo">
      <div class="logo-icon">
        <img src="image/logo.png" alt="Spotly Logo">
      </div>
      Spot<span>ly</span>
    </div>

    <!-- Hero -->
    <div class="hero">
      <div class="hero-text">
        <h1>Welcome <br> <span>Back! 👋</span></h1>
        <p>Sign in to continue to your <br> <span>Spotly</span> dashboard</p>
      </div>
      <div class="welcom-img">
        <img src="image/bg2.png" alt="Welcome Background">
      </div>
    </div>

  </div>

  <div class="container">
    <div class="signupcard">
      <div class="card-title">
        <h2>Sign In</h2>
        <p>Enter your credentials to access your account</p>
      </div>

      <!-- Form Wrapper -->
      <form (ngSubmit)="loginUser($event)">
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <i class="fa-regular fa-user usee"></i>
            <input 
              type="email" 
              id="email" 
              name="email"
              [(ngModel)]="loginData.email" 
              placeholder="Enter your email" 
              required
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <i class="fa-solid fa-lock usee"></i>
            <input 
              [type]="isPasswordVisible ? 'text' : 'password'" 
              id="password" 
              name="password"
              [(ngModel)]="loginData.password" 
              placeholder="Enter your password" 
              required
            >
            <i 
              class="fa-regular" 
              [ngClass]="isPasswordVisible ? 'fa-eye' : 'fa-eye-slash'" 
              class="lock" 
              (click)="togglePassword()"
              style="cursor: pointer;"
            ></i>
          </div>
        </div>

        <div class="save">
          <div class="remmber">
            <input type="checkbox" id="remmberme">
            <label for="remmberme"> Remember me</label> 
          </div>
          <div class="forgot">
            <a href="#">Forgot Password ?</a>
          </div>
        </div>

        <button type="submit" class="create-btn">
          Sign In
        </button>
      </form>

      <p class="or">or continue with</p>
      <div class="soci">
        <a href="#" class="ico"><img src="image/icons8-google-48-removebg-preview.png" alt=""> <h3>Google</h3></a>
        <a href="#" class="ico face"><img src="image/vecteezy_facebook-logo-png-facebook-icon-transparent-png_18930698-removebg-preview.png" alt=""> <h3>Facebook</h3></a>
        <a href="#" class="ico"><img src="image/icons8-apple-logo-50.png" alt=""> <h3>Apple</h3></a>
      </div>

      <!-- Sign Up Link -->
      <div class="login-link">
        Don't have an account?
        <a routerLink="/signup">Sign Up</a>
      </div>

    </div>
  </div>
</div>
