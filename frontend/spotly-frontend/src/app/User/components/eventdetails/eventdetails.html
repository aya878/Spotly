<div class="details" *ngIf="selectedEvent; else loading">
  <div class="container container-user details-container">
    <div class="row g-4">
      <!-- صورة الأيفنت -->
      <div class="col-md-7">
        <img [src]="selectedEvent.image" class="event-banner" [alt]="selectedEvent.title">
      </div>

      <!-- تفاصيل الأيفنت -->
      <div class="col-md-5">
        <div class="event-info-box">
          <span class="badge bg-secondary mb-2">{{ selectedEvent.category }}</span>
          <h2 class="fw-bold mb-3">{{ selectedEvent.title }}</h2>
          <p class="text-muted mb-4">{{ selectedEvent.desc }}</p>

          <hr>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <small class="text-muted d-block">Date & Time</small>
              <strong><i class="fa-regular fa-calendar-days text-purple"></i> {{ selectedEvent.date }}</strong>
            </div>
            <div>
              <small class="text-muted d-block">Price</small>
              <div class="price-tag">{{ selectedEvent.price }} EGP</div>
            </div>
          </div>

          <!-- زرار الحجز النهائي -->
          <button (click)="confirmBooking()" class="btn btn-color w-100 py-3 mt-3 fs-5">
            <i class="fa-solid fa-ticket me-2"></i> Confirm Booking
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="text-center py-5">
    <p>Loading event details...</p>
  </div>
</ng-template>
