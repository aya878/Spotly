<div class="profile-page">

  <div class="profile-header">
    <h1>Profile</h1>
  </div>

  <div class="profile-content">

    <section class="profile-card">

      <div class="profile-card-header">
        <h2>
          Personal Information
        </h2>
      </div>

      <div class="profile-main">

        <!-- PROFILE PHOTO -->

        <div class="profile-photo-section">

          <div class="profile-photo">

            <img
              src="/images/profile/organizer.png"
              [alt]="profile.name"
            >

            <div class="camera-btn">
              <i class="bi bi-camera"></i>
            </div>

          </div>

          <h3>
            {{ profile.name || 'Loading...' }}
          </h3>

          <span>
            Event Organizer
          </span>

        </div>

        <!-- FORM -->

        <div class="profile-form row g-3">

          <!-- NAME -->

          <div class="form-group col-md-6">

            <label class="form-label">
              Full Name
            </label>

            <input
              type="text"
              class="form-control"
              name="name"
              [(ngModel)]="profile.name"
              [disabled]="!isEditing"
            >

          </div>

          <!-- EMAIL -->

          <div class="form-group col-md-6">

            <label class="form-label">
              Email Address
            </label>

            <input
              type="email"
              class="form-control"
              name="email"
              [(ngModel)]="profile.email"
              disabled
            >

          </div>

          <!-- PHONE -->

          <div class="form-group col-md-6">

            <label class="form-label">
              Phone Number
            </label>

            <input
              type="tel"
              class="form-control"
              name="phone"
              [(ngModel)]="profile.phone"
              [disabled]="!isEditing"
            >

          </div>

          <!-- LOCATION -->

          <div class="form-group col-md-6">

            <label class="form-label">
              Location
            </label>

            <input
              type="text"
              class="form-control"
              name="location"
              [(ngModel)]="profile.location"
              [disabled]="!isEditing"
            >

          </div>

        </div>

      </div>

      <!-- BUTTON -->

      <div class="profile-actions">

        <button
          type="button"
          class="btn update-btn"
          (click)="updateProfile()"
        >

          <i
            class="bi"
            [class.bi-pencil]="!isEditing"
            [class.bi-check-lg]="isEditing"
          ></i>

          {{ isEditing
            ? 'Save Changes'
            : 'Update Profile'
          }}

        </button>

      </div>

    </section>

  </div>

</div>
